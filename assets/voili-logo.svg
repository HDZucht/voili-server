<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 100" width="120" height="100">
  <!-- Voili-Logo: stilisierter Volleyball mit drei Wirbelbahnen und zwei Schallbögen.
       Eigene Zeichnung (Aletheia mit HDZ, 2026-11-22), keine Vorlage abgepaust; frei verwendbar. -->
  <defs><clipPath id="ball"><circle cx="46" cy="50" r="40"/></clipPath></defs>
  <circle cx="46" cy="50" r="40" fill="#FFCB2E"/>
  <g clip-path="url(#ball)" fill="none" stroke-linecap="butt">
    <g id="bahn">
      <path d="M46 50 C 66 44 80 26 74 2" stroke="#1E3F95" stroke-width="17"/>
      <path d="M46 50 C 66 44 80 26 74 2" stroke="#0F2457" stroke-width="1.5" transform="translate(-8,-3)"/>
    </g>
    <use href="#bahn" transform="rotate(120 46 50)"/>
    <use href="#bahn" transform="rotate(240 46 50)"/>
  </g>
  <circle cx="46" cy="50" r="40" fill="none" stroke="#0F2457" stroke-width="3"/>
  <g fill="none" stroke="#1F6F5C" stroke-width="4.5" stroke-linecap="round">
    <path d="M93 36 Q100 50 93 64"/>
    <path d="M103 27 Q114 50 103 73"/>
  </g>
</svg>
